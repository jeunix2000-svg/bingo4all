openapi: 3.0.3
info:
  title: YFC 社内Wiki API
  description: |
    YFC社内ナレッジ共有プラットフォームのREST API。
    認証は Entra ID (OIDC) のアクセストークンによる Bearer 認証。
    本仕様は Claude Code 等によるサーバ実装（Controller/DTO）自動生成の基準とする。
  version: 1.0.0
  contact:
    name: YFC IT基盤推進部
servers:
  - url: https://wiki.yfc.internal/api/v1
    description: 本番（社内テナント）
  - url: https://wiki-stg.yfc.internal/api/v1
    description: 検証

security:
  - oidcBearer: []

tags:
  - name: posts
    description: 投稿
  - name: contributions
    description: 回答・補足
  - name: evaluation
    description: 評価（いいね・価値評価・検証）
  - name: search
    description: 検索・一覧
  - name: stats
    description: 統計・ダッシュボード
  - name: moderation
    description: 運用・モデレーション
  - name: ai
    description: AI支援・AIエージェント

paths:
  /posts:
    get:
      tags: [search]
      summary: 投稿一覧・検索
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 全文検索キーワード }
        - { name: category, in: query, schema: { type: string } }
        - { name: postType, in: query, schema: { $ref: '#/components/schemas/PostType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PostStatus' } }
        - { name: unresolvedOnly, in: query, schema: { type: boolean, default: false } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, popular, value], default: newest } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
    post:
      tags: [posts]
      summary: 投稿作成
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [posts]
      summary: 投稿詳細
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [posts]
      summary: 投稿編集
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [posts]
      summary: 投稿削除（論理削除）
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }

  /posts/{id}/transition:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [posts]
      summary: 状態遷移（Draft→Submitted→…→Archived）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, approve, publish, archive, restore]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '409': { $ref: '#/components/responses/Conflict' }

  /posts/{id}/votes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [evaluation]
      summary: いいね/低評価（自票は拒否）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: integer, enum: [1, -1] }
      responses:
        '201': { description: Created }
        '403':
          description: 自己の投稿への投票は禁止
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /posts/{id}/ratings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [evaluation]
      summary: 多軸価値評価（実用性・正確性・新規性）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueRating' }
      responses:
        '201': { description: Created }

  /posts/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [evaluation]
      summary: 検証済みマーク付与（レビュアー以上）
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /posts/{id}/contributions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [contributions]
      summary: 回答・補足の一覧
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contribution' }
    post:
      tags: [contributions]
      summary: 回答または補足の投稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContributionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contribution' }

  /contributions/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [contributions]
      summary: ベストアンサー/補足の採択（質問者またはレビュアー）
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stats/me:
    get:
      tags: [stats]
      summary: 個人ダッシュボード統計
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }

  /stats/org:
    get:
      tags: [stats]
      summary: 全社統計（分類/方式分布・ランキング）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /stats/knowledge-gap:
    get:
      tags: [stats]
      summary: ナレッジ・ギャップ（未解決の多い領域）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeGap' }

  /moderation/reports:
    get:
      tags: [moderation]
      summary: 通報キュー（モデレーター）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }
    post:
      tags: [moderation]
      summary: 投稿の通報
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId, reason]
              properties:
                postId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '201': { description: Created }

  /ai/assist:
    post:
      tags: [ai]
      summary: AI支援（概要生成・分類・タグ・重複検知・推敲）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiAssistRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiAssistResponse' }

  /ai/review:
    post:
      tags: [ai]
      summary: AI Reviewer（信頼度スコア・参考資料・重複率）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId]
              properties:
                postId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReviewResult' }

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID 発行のアクセストークン

  responses:
    BadRequest:
      description: 入力不正
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: 権限不足
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 未検出
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 状態遷移不正
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    PostType:
      type: string
      enum: [SHARE, QUESTION, REVIEW_ITEM, HOWTO, POSTMORTEM, BEST_PRACTICE]
    PostStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVIEW, APPROVED, PUBLISHED, ARCHIVED, DELETED]
    Confidentiality:
      type: string
      enum: [PUBLIC, INTERNAL, DEPT, CONFIDENTIAL]

    Error:
      type: object
      properties:
        code: { type: string, example: SELF_VOTE_FORBIDDEN }
        message: { type: string }
        traceId: { type: string }
      required: [code, message]

    PostCreate:
      type: object
      required: [title, categoryCode, postType, summary, body, confidentiality]
      properties:
        title: { type: string, maxLength: 200 }
        categoryCode: { type: string }
        postType: { $ref: '#/components/schemas/PostType' }
        summary: { type: string, maxLength: 500 }
        body: { type: string, description: Markdown }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        tags: { type: array, items: { type: string } }
        attachmentIds: { type: array, items: { type: string, format: uuid } }

    PostUpdate:
      allOf:
        - $ref: '#/components/schemas/PostCreate'

    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        categoryCode: { type: string }
        postType: { $ref: '#/components/schemas/PostType' }
        status: { $ref: '#/components/schemas/PostStatus' }
        confidentiality: { $ref: '#/components/schemas/Confidentiality' }
        summary: { type: string }
        authorId: { type: string, format: uuid }
        upvoteCount: { type: integer }
        isResolved: { type: boolean }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            body: { type: string }
            tags: { type: array, items: { type: string } }
            contributions:
              type: array
              items: { $ref: '#/components/schemas/Contribution' }

    PostPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    ContributionCreate:
      type: object
      required: [kind, body]
      properties:
        kind: { type: string, enum: [ANSWER, SUPPLEMENT] }
        body: { type: string, description: Markdown }

    Contribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        kind: { type: string, enum: [ANSWER, SUPPLEMENT] }
        isAccepted: { type: boolean }
        createdAt: { type: string, format: date-time }

    ValueRating:
      type: object
      required: [usefulness, accuracy, novelty]
      properties:
        usefulness: { type: integer, minimum: 1, maximum: 5 }
        accuracy: { type: integer, minimum: 1, maximum: 5 }
        novelty: { type: integer, minimum: 1, maximum: 5 }

    UserStats:
      type: object
      properties:
        postCount: { type: integer }
        upvotesReceived: { type: integer }
        totalPoints: { type: integer }
        level: { type: string }
        acceptedContribs: { type: integer }
        badges: { type: array, items: { type: string } }

    KnowledgeGap:
      type: object
      properties:
        categoryCode: { type: string }
        questionTotal: { type: integer }
        unresolved: { type: integer }
        resolvedRatePct: { type: number }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        reason: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        createdAt: { type: string, format: date-time }

    AiAssistRequest:
      type: object
      required: [body]
      properties:
        title: { type: string }
        body: { type: string }
        features:
          type: array
          items:
            type: string
            enum: [SUMMARY, CLASSIFY, TAG, DEDUP, POLISH]

    AiAssistResponse:
      type: object
      properties:
        summary: { type: string }
        suggestedCategory: { type: string }
        suggestedTags: { type: array, items: { type: string } }
        duplicates:
          type: array
          items:
            type: object
            properties:
              postId: { type: string, format: uuid }
              similarity: { type: number, description: 0.0–1.0 }
        polishedBody: { type: string }

    AiReviewResult:
      type: object
      properties:
        credibilityScore: { type: integer, description: 0–100, example: 83 }
        recommendedReferences:
          type: array
          items: { type: string }
        duplicateOf:
          type: array
          items:
            type: object
            properties:
              postId: { type: string, format: uuid }
              similarity: { type: number, example: 0.92 }
        relatedKnowledge:
          type: array
          items: { type: string, format: uuid }
