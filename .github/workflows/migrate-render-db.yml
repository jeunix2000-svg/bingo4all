name: Migrate Render Postgres
# Retrigger: empty push does not match paths; use workflow_dispatch or edit migrations/

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'yfc-ai-platform/db/migrations/**'
      - '.github/workflows/migrate-render-db.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Secret 配置在 Environment「RENDER_DATABASE_URL」中（见 Settings → Environments）
    environment: RENDER_DATABASE_URL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secret
        env:
          SEC_RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          SEC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SEC_RENDER_POSTGRES_URL: ${{ secrets.RENDER_POSTGRES_URL }}
          SEC_RENDER_DB_URL: ${{ secrets.RENDER_DB_URL }}
          VAR_RENDER_DATABASE_URL: ${{ vars.RENDER_DATABASE_URL }}
        run: |
          pick=""
          for candidate in \
            "$SEC_RENDER_DATABASE_URL" \
            "$SEC_DATABASE_URL" \
            "$SEC_POSTGRES_URL" \
            "$SEC_RENDER_POSTGRES_URL" \
            "$SEC_RENDER_DB_URL" \
            "$VAR_RENDER_DATABASE_URL"
          do
            if [ -n "$candidate" ]; then
              pick="$candidate"
              break
            fi
          done
          if [ -z "$pick" ]; then
            echo "::error::Actions 未读到数据库连接串。"
            echo "::error::请在 Environment「RENDER_DATABASE_URL」中添加 Secret（推荐）"
            echo "::error::Settings → Environments → RENDER_DATABASE_URL → Environment secrets"
            exit 1
          fi
          if [[ ! "$pick" =~ ^postgres(ql)?:// ]]; then
            echo "::error::Database URL 应以 postgres:// 或 postgresql:// 开头"
            exit 1
          fi
          echo "DATABASE_URL=$pick" >> "$GITHUB_ENV"
          echo "Secret 已配置（长度 ${#pick} 字符）"

      - name: Parse DATABASE_URL
        run: |
          python3 <<'PY'
          import os
          from urllib.parse import urlparse, unquote
          url = os.environ["DATABASE_URL"]
          p = urlparse(url)
          if p.scheme not in ("postgres", "postgresql") or not p.hostname:
              raise SystemExit(f"Invalid DATABASE_URL scheme/host: {p.scheme}")
          if "." not in p.hostname:
              raise SystemExit(
                  f"Hostname '{p.hostname}' 不完整。"
                  "请使用 Render External Database URL（主机名应含 .render.com，"
                  "例如 dpg-xxx.oregon-postgres.render.com）"
              )
          port = p.port or 5432
          db = (p.path or "/").lstrip("/") or "postgres"
          jdbc = f"jdbc:postgresql://{p.hostname}:{port}/{db}"
          if p.query:
              jdbc += f"?{p.query}"
          elif "render.com" in (p.hostname or "") or (p.hostname or "").startswith("dpg-"):
              jdbc += "?sslmode=require"
          user = unquote(p.username or "")
          password = unquote(p.password or "")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"JDBC_URL={jdbc}\n")
              f.write(f"PGUSER<<EOF\n{user}\nEOF\n")
              f.write(f"PGPASSWORD<<EOF\n{password}\nEOF\n")
          print(f"==> JDBC host={p.hostname} db={db} user={user}")
          PY

      - name: Flyway migrate V1–V4
        run: |
          echo "==> Flyway migrate → Render Postgres"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/yfc-ai-platform/db/migrations:/flyway/sql" \
            flyway/flyway:10 \
            -url="$JDBC_URL" \
            -user="$PGUSER" \
            -password="$PGPASSWORD" \
            migrate

      - name: Verify schemas
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:16-alpine \
            sh -c '
              apk add --no-cache postgresql-client >/dev/null
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
                SELECT schemaname, tablename FROM pg_tables
                WHERE schemaname IN ('\''wiki'\'', '\''points'\'', '\''platform'\'')
                ORDER BY 1, 2;
              "
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
                SELECT id, email, display_name FROM wiki.app_user LIMIT 5;
              "
            '
