<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="portal-i18n-title" content="wheel.title">
  <link rel="stylesheet" href="portal-i18n.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラッキールーレット</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #1a1a2e;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2rem 1rem 3rem;
      position: relative;
    }

    #bg-cycle { position: fixed; inset: 0; z-index: -2; }
    .bg-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 5s ease-in-out; }
    .bg-layer.visible { opacity: 1; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .portal-back-btn {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 300;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #1a1a2e;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(255, 215, 0, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .portal-back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(255, 215, 0, 0.5);
      color: #1a1a2e;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 0.4rem;
      background: linear-gradient(90deg, #ffd700, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { font-size: 0.9rem; color: rgba(255, 255, 255, 0.5); margin-bottom: 2rem; }

    .wheel-wrap {
      position: relative;
      width: min(340px, 88vw);
      height: min(340px, 88vw);
      margin-bottom: 2rem;
    }

    .wheel-glow {
      position: absolute; inset: -12px; border-radius: 50%;
      background: conic-gradient(from 0deg, #ffd700, #ff6b6b, #4ecdc4, #a29bfe, #ffd700);
      animation: glow-spin 8s linear infinite; opacity: 0.6; filter: blur(8px);
    }
    @keyframes glow-spin { to { transform: rotate(360deg); } }

    .wheel-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 6px solid rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.4);
      z-index: 2; pointer-events: none;
    }

    #wheel { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; }

    .pointer {
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%); z-index: 10;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-top: 36px solid #ffd700;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
    }

    .center-dot {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(145deg, #ffd700, #e6a800);
      border: 3px solid #fff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
      pointer-events: none;
    }

    #spin-btn {
      padding: 0.9rem 3rem; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.2em;
      color: #1a1a2e; background: linear-gradient(135deg, #ffd700, #ffb347);
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      position: relative;
    }
    #spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 215, 0, 0.55); }
    #spin-btn:active:not(:disabled) {
      transform: scale(0.92) translateY(1px);
      box-shadow: 0 2px 12px rgba(255, 215, 0, 0.35);
      filter: brightness(1.15);
    }
    #spin-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    #spin-btn.is-ready,
    #spin-btn:not(:disabled) { opacity: 1; cursor: pointer; }

    @keyframes spin-btn-pop {
      0%   { transform: scale(1); filter: brightness(1); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.4); }
      18%  { transform: scale(0.86); filter: brightness(1.35); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      45%  { transform: scale(1.14); filter: brightness(1.25); box-shadow: 0 0 45px rgba(255, 215, 0, 1), 0 0 70px rgba(255, 255, 255, 0.45); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); filter: brightness(1); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.4); }
    }
    @keyframes spin-btn-ring {
      0%   { opacity: 0.85; transform: scale(0.6); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    #spin-btn.btn-flash::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      pointer-events: none;
      animation: spin-btn-ring 0.55s ease-out forwards;
    }
    #spin-btn.btn-flash { animation: spin-btn-pop 0.55s cubic-bezier(0.34, 1.45, 0.64, 1); }
    #spin-btn.btn-flash.combo-x3 { background: linear-gradient(135deg, #fff59d, #ffd700); }
    #spin-btn.btn-flash.combo-x4 { background: linear-gradient(135deg, #ffe082, #ff9800); color: #2a1400; }
    #spin-btn.btn-flash.combo-x5 { background: linear-gradient(135deg, #ffab91, #ff5722); color: #fff; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
    }

    #reset-btn {
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    #reset-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.12);
    }

    #reset-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    #result { margin-top: 1.5rem; min-height: 2rem; font-size: 1.1rem; text-align: center; padding: 0 1rem; }
    #result.win { font-size: 1.3rem; font-weight: 700; color: #ffd700; animation: pop 0.5s ease; }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

    .combo-display {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 200;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffd700;
      background: rgba(255, 215, 0, 0.12);
      border: 1px solid rgba(255, 215, 0, 0.35);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .combo-display.visible { opacity: 1; transform: scale(1); }
    .combo-display.bump { animation: combo-bump 0.35s ease; }
    @keyframes combo-bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); color: #fff; }
      100% { transform: scale(1); }
    }

    .prize-table-wrap { margin-bottom: 1.8rem; width: min(360px, 92vw); }
    .prize-table-wrap h2 { font-size: 0.95rem; font-weight: 600; color: rgba(255,255,255,0.7); text-align: center; margin-bottom: 0.75rem; }
    .prize-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; }
    .prize-table th, .prize-table td { padding: 0.75rem 1rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .prize-table th { font-size: 0.85rem; color: rgba(255,255,255,0.55); background: rgba(0,0,0,0.2); }
    .prize-table tr:last-child td { border-bottom: none; }
    .color-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 0.5rem; vertical-align: middle; }
    .prize-table .amount { font-weight: 700; color: #ffd700; }
    .prize-table .win-count { font-weight: 700; font-size: 1.05rem; }

    #screen-flash {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      opacity: 0;
      background: var(--flash-color, rgba(255, 215, 0, 0.45));
      mix-blend-mode: screen;
    }
    #screen-flash.active { animation: screen-flash-pulse 0.8s ease-out forwards; }
    #screen-flash.lv-5 { mix-blend-mode: color-dodge; }
    @keyframes screen-flash-pulse {
      0%   { opacity: 0; transform: scale(1); }
      12%  { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1); }
    }
    body.screen-combo-1::before { background: radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.18) 0%, transparent 55%); }
    body.screen-combo-2::before { background: radial-gradient(circle at 50% 40%, rgba(33, 150, 243, 0.2) 0%, transparent 55%); }
    body.screen-combo-3::before { background: radial-gradient(circle at 50% 40%, rgba(76, 175, 80, 0.2) 0%, transparent 55%); }
    body.screen-combo-4::before { background: radial-gradient(circle at 50% 40%, rgba(255, 152, 0, 0.22) 0%, transparent 55%); }
    body.screen-combo-5::before { background: radial-gradient(circle at 50% 40%, rgba(233, 30, 99, 0.24) 0%, transparent 55%); }
    body::before { transition: background 0.6s ease; }
    .bg-layer { transition: opacity 0.85s ease-in-out; }
  </style>
</head>
<body>
  <a class="portal-back-btn" href="index.html" data-i18n="common.back">← ポータルへ戻る</a>
  <div id="bg-cycle" aria-hidden="true">
    <div class="bg-layer visible" id="bg-a"></div>
    <div class="bg-layer" id="bg-b"></div>
  </div>
  <h1 data-i18n="wheel.h1">ラッキールーレット</h1>
  <p class="subtitle" data-i18n="wheel.subtitle">ボタンを押して運試し（スペース連打でコンボ加速！）</p>
  <div id="combo-display" class="combo-display" aria-live="polite"></div>
  <div class="wheel-wrap">
    <div class="wheel-glow"></div>
    <canvas id="wheel"></canvas>
    <div class="wheel-ring"></div>
    <div class="pointer"></div>
    <div class="center-dot">🎁</div>
  </div>
  <div class="prize-table-wrap">
    <h2 data-i18n="wheel.prize_h2">賞品一覧</h2>
    <table class="prize-table">
      <thead><tr><th data-i18n="wheel.th_color">区分の色</th><th data-i18n="wheel.th_amount">賞金額</th><th data-i18n="wheel.th_count">当選回数</th></tr></thead>
      <tbody id="prize-table-body"></tbody>
    </table>
  </div>
  <div class="btn-row">
    <button id="spin-btn" data-i18n="wheel.start">抽選スタート</button>
    <button id="reset-btn" type="button" data-i18n="wheel.reset">リセット</button>
  </div>
  <p id="result"></p>
  <script src="portal-i18n.js"></script>
  <script src="screen-effects.js"></script>
  <script src="celebrate.js"></script>
  <script src="wheel.js"></script>
</body>
</html>
