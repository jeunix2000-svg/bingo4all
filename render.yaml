# Bingo4All — Render Blueprint
# 1. Static site: 前端（本仓库根目录）
# 2. Web Service: api/ 目录下的 Node 同步 API

services:
  - type: web
    name: bingo4all
    runtime: static
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: bingo4all-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://bingo4all.onrender.com
