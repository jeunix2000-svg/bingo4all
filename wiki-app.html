<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="portal-i18n-title" content="wikiapp.title">
  <link rel="stylesheet" href="portal-i18n.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库 | YFC AI Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background: #0f1419;
      color: #fff;
      min-height: 100vh;
      line-height: 1.55;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 15%, rgba(52, 152, 219, 0.15) 0%, transparent 45%),
        linear-gradient(135deg, #0f1419 0%, #16213e 60%, #0f3460 100%);
    }
    .portal-back-btn {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 500;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a1a2e !important;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      border-radius: 50px;
      text-decoration: none !important;
      box-shadow: 0 4px 18px rgba(255, 215, 0, 0.35);
    }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.9rem 2rem 0.9rem 11rem;
      background: rgba(15, 20, 25, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #7eb8ff, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav { display: flex; gap: 1rem; list-style: none; flex-wrap: wrap; }
    .nav a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.88rem; }
    .nav a:hover { color: #ffd700; }
    .page-main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .hero { margin-bottom: 1.5rem; }
    .hero h1 { font-size: 1.75rem; margin-bottom: 0.35rem; color: #ffd700; }
    .hero p { color: rgba(255,255,255,0.6); font-size: 0.92rem; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .status-pill {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-pill.ok { background: rgba(46,204,113,0.15); color: #6ee7a0; }
    .status-pill.err { background: rgba(231,76,60,0.15); color: #ff9b8a; }
    #api-status-detail, #points-balance {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.25rem;
    }
    .btn {
      padding: 0.45rem 1rem;
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 50px;
      background: rgba(255,215,0,0.1);
      color: #ffd700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .panel h2 { font-size: 0.95rem; color: #7eb8ff; margin-bottom: 0.85rem; }
    .post-card {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .post-card:last-child { border-bottom: none; }
    .post-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
    .tag {
      font-size: 0.72rem;
      padding: 0.12rem 0.45rem;
      border-radius: 50px;
      background: rgba(126,184,255,0.15);
      color: #a8d4ff;
    }
    .tag.muted { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
    .date { font-size: 0.72rem; color: rgba(255,255,255,0.35); }
    .post-card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
    .post-card p { font-size: 0.85rem; color: rgba(255,255,255,0.55); }
    .post-foot { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 0.35rem; }
    .empty { color: rgba(255,255,255,0.45); font-size: 0.88rem; }
    .empty.err { color: #ff9b8a; }
    .form-grid {
      display: grid;
      gap: 0.75rem;
    }
    label { display: grid; gap: 0.25rem; font-size: 0.82rem; color: rgba(255,255,255,0.65); }
    input, select, textarea {
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    .submit-btn {
      justify-self: start;
      padding: 0.55rem 1.25rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 768px) {
      .site-header { padding: 0.8rem 1rem; }
      .portal-back-btn { top: auto; bottom: 1rem; z-index: 200; }
    }
  </style>
</head>
<body>
  <a class="portal-back-btn" href="index.html" data-i18n="common.back">← 返回门户</a>

  <header class="site-header">
    <div class="logo" data-i18n="wikiapp.logo">YFC 知识库</div>
    <nav>
      <ul class="nav">
        <li><a href="index.html" data-i18n="common.nav_portal">门户</a></li>
        <li><a href="wiki/" data-i18n-wiki-link data-i18n="wikiapp.nav_design">设计 WIKI</a></li>
        <li><a href="yfc-ai-platform/" data-i18n="common.nav_platform">AI Platform</a></li>
      </ul>
    </nav>
    <div data-lang-switcher></div>
  </header>

  <main class="page-main">
    <section class="hero">
      <h1 data-i18n="wikiapp.hero_h1">知识库（Live API）</h1>
      <p data-i18n="wikiapp.hero_p">通过门户直接连接 Render 上的 Wiki Module API，浏览与创建知识帖。</p>
    </section>

    <div class="toolbar">
      <div>
        <span id="api-status" class="status-pill err" data-i18n="wikiapp.status_checking">检测中…</span>
        <div id="api-status-detail"></div>
        <div id="points-balance"></div>
      </div>
      <button type="button" class="btn" id="btn-refresh" data-i18n="wikiapp.refresh">刷新</button>
    </div>

    <section class="panel">
      <h2 data-i18n="wikiapp.posts_h2">最新帖子</h2>
      <div id="posts-list"><p class="empty" data-i18n="wikiapp.posts_loading">加载中…</p></div>
    </section>

    <section class="panel">
      <h2 data-i18n="wikiapp.create_h2">创建帖子</h2>
      <form id="post-form" class="form-grid">
        <label><span data-i18n="wikiapp.label_title">标题</span>
          <input name="title" required maxlength="200" data-i18n-placeholder="wikiapp.ph_title" placeholder="例：COBOL 迁移注意事项">
        </label>
        <label><span data-i18n="wikiapp.label_category">分类代码</span>
          <input name="categoryCode" value="GENERAL" maxlength="32">
        </label>
        <label><span data-i18n="wikiapp.label_type">类型</span>
          <select name="postType">
            <option value="SHARE">分享 SHARE</option>
            <option value="QUESTION">提问 QUESTION</option>
            <option value="HOWTO">教程 HOWTO</option>
            <option value="POSTMORTEM">复盘 POSTMORTEM</option>
            <option value="BEST_PRACTICE">最佳实践</option>
          </select>
        </label>
        <label><span data-i18n="wikiapp.label_conf">机密级别</span>
          <select name="confidentiality">
            <option value="INTERNAL">内部 INTERNAL</option>
            <option value="PUBLIC">公开 PUBLIC</option>
            <option value="DEPT">部门 DEPT</option>
          </select>
        </label>
        <label><span data-i18n="wikiapp.label_summary">摘要（可留空，AI 自动补全）</span>
          <input name="summary" maxlength="500">
        </label>
        <label><span data-i18n="wikiapp.label_body">正文（Markdown）</span>
          <textarea name="body" required data-i18n-placeholder="wikiapp.ph_body" placeholder="# 正文内容"></textarea>
        </label>
        <button type="submit" class="submit-btn" data-i18n="wikiapp.submit">发布到 Render API</button>
      </form>
    </section>
  </main>

  <script src="portal-i18n.js"></script>
  <script src="portal-config.js"></script>
  <script src="wiki-app.js"></script>
</body>
</html>
